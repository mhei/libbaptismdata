openapi: 3.0.3
info:
  title: Baptism Data Daemon API
  version: 0.2.0
  description: 'Read and modify device baptism data through libbaptismdata. Keys and
    values are UTF-8 strings. Only exact names in WritableKey are writable. Repeated
    WritableKey lines and comma-separated names are supported.

    Optional Password contains a Modular Crypt Format hash; HTTP Basic authentication
    uses username admin and protects only writes. All GET endpoints are password-free.
    Metadata reports write_authentication_required. Static login assets and the specification
    are public unless mTLS is enabled.

    CertificateFile and PrivateKeyFile activate HTTPS with TLS 1.2/1.3; self-signed
    server certificates are supported without a root CA file on the device. Clients
    must trust the server certificate or its CA. Optional ClientCAFile activates mandatory
    client-certificate authentication on all routes. Invalid or partial TLS configuration
    prevents startup.

    Changes are persisted before success is returned. Physical storage errors may
    leave storage partially written; read back before retrying.

    '
servers:
- url: http://{host}:{port}
  description: HTTP; optional Password authentication.
  variables:
    host:
      default: localhost
    port:
      default: '8080'
- url: https://{host}:{port}
  description: HTTPS; optional Password and optional client-certificate authentication.
  variables:
    host:
      default: localhost
    port:
      default: '8080'
x-mutual-tls:
  required-when: ClientCAFile is configured
  client-ca-configuration: ClientCAFile
  independent-server-and-client-cas: true
tags:
- name: Baptism data
paths:
  /api/v1/baptism-data:
    get:
      tags:
      - Baptism data
      operationId: listBaptismData
      summary: Read all existing baptism data
      description: Returns an empty object when no keys exist. Request bodies are
        not accepted.
      responses:
        '200':
          description: All existing key-value pairs.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
              example:
                serial: ABC123
                serial#: BOARD42
                model: Test Device
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
    put:
      operationId: saveBaptismData
      summary: Apply a batch and persist once
      description: All names and permissions are validated before storage access.
        Strings set values (including empty strings); null deletes a key, including
        absent keys. Unspecified keys remain unchanged. The library lock covers all
        staged changes and one store call. A physical storage failure may leave storage
        partially written; success is returned only after store succeeds. Maximum
        body size 1048576 bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
                nullable: true
      responses:
        '204':
          description: All changes persisted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          description: 'Write authentication missing or invalid. Basic challenge included
            except for X-Requested-With: XMLHttpRequest.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - {}
      - password: []
  /api/v1/baptism-data/{key}:
    parameters:
    - name: key
      in: path
      required: true
      description: 'Exact key name, percent-encoded as a single path segment. Decoded

        exactly once: serial%23 means serial#, serial%2523 means serial%23,

        and a%2Fb means a/b. A literal plus sign stays a plus sign.

        Empty names, NUL, ASCII control characters, DEL and ''='' are invalid.

        Malformed percent encoding and invalid UTF-8 are rejected.

        '
      schema:
        type: string
        minLength: 1
        pattern: ^[^=\x00-\x1F\x7F]+$
      example: serial#
    get:
      tags:
      - Baptism data
      operationId: getBaptismData
      summary: Read one key
      description: Request bodies are not accepted.
      responses:
        '200':
          description: Current value, including an empty string if stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Value'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/TooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
    put:
      tags:
      - Baptism data
      operationId: setBaptismData
      summary: Create or update one whitelisted key
      description: 'Requires an exact WritableKey match, whether or not the key exists.

        An empty string is a value, not a deletion. The complete request body

        must not exceed 1048576 bytes, including JSON formatting and encoding.

        A read-only key is rejected before accessing storage.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Value'
      responses:
        '200':
          description: Existing key updated and persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Value'
        '201':
          description: New key created and persisted.
          headers:
            Location:
              description: Percent-encoded path of the created resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Value'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          description: 'Write authentication missing or invalid. Basic challenge included
            except for X-Requested-With: XMLHttpRequest.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - {}
      - password: []
    delete:
      tags:
      - Baptism data
      operationId: deleteBaptismData
      summary: Delete one whitelisted key
      description: 'Requires an exact WritableKey match. Non-whitelisted keys return
        403

        even when absent. Request bodies are not accepted.

        '
      responses:
        '204':
          description: Key deleted and change persisted. No response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          description: 'Write authentication missing or invalid. Basic challenge included
            except for X-Requested-With: XMLHttpRequest.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - {}
      - password: []
  /api/v1/metadata:
    get:
      operationId: getMetadata
      summary: List existing and configured writable keys with edit permissions
      responses:
        '200':
          description: keys maps each name to true (writable) or false (read only).
            Includes writable names that do not exist yet.
          content:
            application/json:
              schema:
                type: object
                required:
                - keys
                - write_authentication_required
                properties:
                  keys:
                    type: object
                    additionalProperties:
                      type: boolean
                  write_authentication_required:
                    type: boolean
                    description: True when writing requires HTTP Basic authentication.
                      Does not change per-key write permissions.
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
  /openapi.yaml:
    get:
      operationId: getOpenAPI
      summary: Download the API specification
      security: []
      responses:
        '200':
          description: OpenAPI YAML document. Client certificate required only when
            ClientCAFile is configured.
          content:
            application/yaml:
              schema:
                type: string
components:
  schemas:
    Value:
      type: object
      additionalProperties: false
      required:
      - value
      properties:
        value:
          type: string
          pattern: ^[^\u0000]*$
          description: UTF-8 string; an empty string is allowed, NUL and null are
            not.
          example: ABC123
    Error:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - invalid_key
              - invalid_body
              - not_found
              - key_not_found
              - key_read_only
              - client_certificate_required
              - method_not_allowed
              - body_too_large
              - unsupported_media_type
              - internal_error
              - authentication_required
            message:
              type: string
              description: Human-readable description; clients should branch on code.
  responses:
    BadRequest:
      description: Invalid key, JSON, value or unexpected request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'Client certificate missing or invalid in mTLS mode, or key not
        in the

        write whitelist. TLS handshake failures have no HTTP response.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Key or route does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: Request body exceeds 1048576 bytes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: PUT requires Content-Type application/json (parameters are accepted).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: Method not supported for this route.
      headers:
        Allow:
          schema:
            type: string
          description: GET, PUT for the collection; GET, PUT, DELETE for an individual
            key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Storage or internal error. No successful persistence is confirmed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    password:
      type: http
      scheme: basic
      description: Required for PUT and DELETE when Password is nonempty; username
        admin. GET is public. XMLHttpRequest requests suppress the Basic challenge.
security: []
