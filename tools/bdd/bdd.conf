# Manufacturer defaults. Put local overrides in /etc/bdd/bdd.conf.d/*.conf.

[bdd]
#
# bind HTTP REST server to given address
#
ListenAddress=0.0.0.0

#
# use this port for the HTTP REST server
#
Port=8080

#
# announce service via zeroconf
#
Zeroconf=yes

#
# List of baptism data keys which can be modified
#
WritableKey="chargebox_serial, serial"

#
# Optional password for write access/modifying baptism data, user name is always "admin".
#
# Password="$6$bddexample$N9DL9jxlyl.VGooKEAwUzE4dVLjjeevO/j1XxeD6iqhQvnDA4rMJUfCbQ7wd9SIM7hGh6aPzrN.cUyrUqqBPf/"

#
# CertificateFile and PrivateKeyFile enable HTTPS
#
# CertificateFile=/etc/bdd/server-chain.pem
# PrivateKeyFile=/etc/bdd/server-key.pem

#
# ClientCAFile additionally requires trusted client certificates (mTLS).
#
# ClientCAFile=/etc/bdd/client-ca.pem
